name: Dev Deploy to AWS EC2 (Docker)

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set YML
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.DEV_APPLICATION_YML }}" | base64 --decode > src/main/resources/application-dev.yml
          echo "${{ secrets.SOCIAL_APPLICATION_YML }}" | base64 --decode > src/main/resources/application-social.yml
          echo "${{ secrets.AWS_APPLICATION_YML }}" | base64 --decode > src/main/resources/application-aws.yml
          find src
          rm src/main/resources/application-local.yml
          rm src/main/resources/application-test.yml

      - name: Set AuthKey
        run: |
          mkdir -p src/main/resources/static
          echo "${{ secrets.AUTH_KEY }}" > src/main/resources/static/AuthKey.p8

      - name: Set Firebase Credentials
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" | base64 --decode > src/main/resources/firebase.json
          if [ ! -s src/main/resources/firebase.json ]; then
            echo "Error: firebase.json is empty. Check FIREBASE_CREDENTIALS secret."
            exit 1
          fi
          echo "firebase.json size: $(wc -c < src/main/resources/firebase.json) bytes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Set Date
        run: |
          echo "date=$(TZ=Asia/Seoul date +'%y%m%d')" >> $GITHUB_ENV
      - id: commit-hash
        uses: prompt/actions-commit-hash@v3

      - name: Set AWS IAM User
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
          REPOSITORY_NAME: near-dev
          IMAGE_TAG: ${{ format('{0}-{1}', env.date, steps.commit-hash.outputs.short) }}
        run: |
          docker build -t $DOCKER_REGISTRY_URL/$REPOSITORY_NAME:$IMAGE_TAG -f ./Dockerfiles/Dockerfile-dev  .
          docker image tag $DOCKER_REGISTRY_URL/$REPOSITORY_NAME:$IMAGE_TAG $DOCKER_REGISTRY_URL/$REPOSITORY_NAME:latest
          docker push $DOCKER_REGISTRY_URL/$REPOSITORY_NAME:$IMAGE_TAG
          docker push $DOCKER_REGISTRY_URL/$REPOSITORY_NAME:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sh deploy.sh

